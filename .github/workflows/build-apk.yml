name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Fetch S Pen SDK
        run: |
          mkdir -p app/libs
          curl -fsSL -o app/libs/spenremote-v1.0.1.jar https://raw.githubusercontent.com/jojczak/PenMouseS/main/libs/spenremote-v1.0.1.jar
          curl -fsSL -o app/libs/sdk-v1.0.0.jar https://raw.githubusercontent.com/jojczak/PenMouseS/main/libs/sdk-v1.0.0.jar

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AirPenStudio.apk
          ls -lh dist/AirPenStudio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AirPenStudio
          path: dist/AirPenStudio.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: AirPen Studio 1.0.3
          files: dist/AirPenStudio.apk
          fail_on_unmatched_files: true
          body: |
            Fixes for Galaxy S22 Ultra: flick directions, on-screen mouse cursor, and air-type letters.

            **Uninstall any older AirPen Studio first**, then install this APK.

            1. Download **AirPenStudio.apk** below.
            2. Open the file and install. Allow "Install unknown apps" for Chrome/Files if asked.
            3. Open **AirPen Studio**. Turn on **Accessibility** and **Display over other apps** — the cursor needs both.
            4. Samsung Settings → Advanced features → S Pen → Air actions: turn other apps off.
            5. Pull the S Pen out, tap **Connect S Pen**, then pick Gesture / Mouse / Type.
            6. Hold the side button, draw, release. Left flick = backspace, right flick = space when typing.
