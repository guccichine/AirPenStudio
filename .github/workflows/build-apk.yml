name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Fetch S Pen SDK
        run: |
          mkdir -p app/libs
          curl -fsSL -o app/libs/spenremote-v1.0.1.jar https://raw.githubusercontent.com/jojczak/PenMouseS/main/libs/spenremote-v1.0.1.jar
          curl -fsSL -o app/libs/sdk-v1.0.0.jar https://raw.githubusercontent.com/jojczak/PenMouseS/main/libs/sdk-v1.0.0.jar

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AirPenStudio.apk
          ls -lh dist/AirPenStudio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AirPenStudio
          path: dist/AirPenStudio.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          name: AirPen Studio 1.1.1
          files: dist/AirPenStudio.apk
          fail_on_unmatched_files: true
          body: |
            **1.1.1 rollback** — S Pen engine from 1.0.8 (two builds back).

            1.1.0 auto-armed every motion event and kept the BLE session hogged, so the hardware S Pen stopped working. This build requires the side button again and clears those settings.

            **Uninstall any older AirPen Studio first**, then install this APK. If the pen is still dead after uninstall, pop it in and out and reboot.

            1. Download **AirPenStudio.apk** below and install it.
            2. Enable **Accessibility** and **Display over other apps**.
            3. Tap **Connect S Pen**.
            4. **Air Type:** Type tab → Start Air Type. Hold the side button and write a letter.
            5. If a letter is wrong: Home → turn on **Recognize as letter**, draw it, tap the correct letter to train.
            6. **Gestures** tab: search actions (YouTube, share, zoom, jump to top, Wi-Fi, …) and bind wave / diamond / hook too.

            Immediate fallback while this builds: [AirPenStudio 1.0.8 APK](https://github.com/guccichine/AirPenStudio/releases/download/v1.0.8/AirPenStudio.apk)
