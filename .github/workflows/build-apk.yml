name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Fetch S Pen SDK
        run: |
          mkdir -p app/libs
          curl -fsSL -o app/libs/spenremote-v1.0.1.jar https://raw.githubusercontent.com/jojczak/PenMouseS/main/libs/spenremote-v1.0.1.jar
          curl -fsSL -o app/libs/sdk-v1.0.0.jar https://raw.githubusercontent.com/jojczak/PenMouseS/main/libs/sdk-v1.0.0.jar

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AirPenStudio.apk
          ls -lh dist/AirPenStudio.apk

      - name: Read version
        id: ver
        run: |
          NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: AirPenStudio
          path: dist/AirPenStudio.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: AirPen Studio ${{ steps.ver.outputs.name }}
          files: dist/AirPenStudio.apk
          fail_on_unmatched_files: true
          body: |
            **${{ steps.ver.outputs.name }} air-gesture accuracy** — same S Pen connection as 1.1.1, tighter flicks.

            - Ballistic-window heading: post-flick droop no longer rotates ↑ into a diagonal
            - Bent-stroke gate: L / hook / check are no longer stolen as flicks
            - 3-sample median + spike clamp on IMU before the One Euro filter
            - One Euro IMU filter, radial dead zone, velocity-weighted heading, cardinal bias

            **Uninstall any older AirPen Studio first**, then install this APK.

            1. Download **AirPenStudio.apk** below and install it.
            2. Enable **Accessibility** and **Display over other apps**.
            3. Tap **Connect S Pen**.
            4. Hold the side button and flick. Up/down still scrolls one page.
            5. If flicks land on a diagonal, raise **Cardinal bias** in More → settings.
            6. If the pen jitters, raise **Motion smoothing**. If flicks feel sticky, lower it.

