name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Fetch S Pen SDK
        run: |
          mkdir -p app/libs
          curl -fsSL -o app/libs/spenremote-v1.0.1.jar https://raw.githubusercontent.com/jojczak/PenMouseS/main/libs/spenremote-v1.0.1.jar
          curl -fsSL -o app/libs/sdk-v1.0.0.jar https://raw.githubusercontent.com/jojczak/PenMouseS/main/libs/sdk-v1.0.0.jar

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AirPenStudio.apk
          ls -lh dist/AirPenStudio.apk

      - name: Read version
        id: ver
        run: |
          NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/".*"/placeholder/' )
          NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: AirPenStudio
          path: dist/AirPenStudio.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: AirPen Studio ${{ steps.ver.outputs.name }}
          files: dist/AirPenStudio.apk
          fail_on_unmatched_files: true
          body: |
            **${{ steps.ver.outputs.name }} — glow trail + hover previews.** Air mouse draws a gold glow trail (28 styles). Buttons glow when hovered or pressed. Hold a gesture or a setup row to peek the clip and the destination page.

            1.3 accuracy is still here (ballistic-window heading, bent-stroke gate, One Euro IMU). S Pen still requires the side button.

            **Uninstall any older AirPen Studio first**, then install this APK.

            1. Download **AirPenStudio.apk** below and install it.
            2. Enable **Accessibility** and **Display over other apps**.
            3. Tap **Connect S Pen**.
            4. **Train a gesture:** Home → Practice pad → draw it with a finger → tap the matching air-gesture chip. Draw it again to confirm it now matches yours.
            5. **Air Type:** Type tab → Start Air Type. Hold the side button and write a letter. Same pad, turn on **Train letters instead**.
            6. If flicks land on a diagonal, raise **Cardinal bias** in More → settings.
