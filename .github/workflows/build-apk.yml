name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Fetch S Pen SDK
        run: |
          mkdir -p app/libs
          curl -fsSL -o app/libs/spenremote-v1.0.1.jar https://raw.githubusercontent.com/jojczak/PenMouseS/main/libs/spenremote-v1.0.1.jar
          curl -fsSL -o app/libs/sdk-v1.0.0.jar https://raw.githubusercontent.com/jojczak/PenMouseS/main/libs/sdk-v1.0.0.jar

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AirPenStudio.apk
          ls -lh dist/AirPenStudio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AirPenStudio
          path: dist/AirPenStudio.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          name: AirPen Studio 1.0.6
          files: dist/AirPenStudio.apk
          fail_on_unmatched_files: true
          body: |
            Flick up / flick down now scroll the screen — in Chrome, feeds, Settings, anywhere Accessibility can swipe.

            **Uninstall any older AirPen Studio first**, then install this APK.

            1. Download **AirPenStudio.apk** below and install it.
            2. Open AirPen Studio. Enable **Accessibility** and **Display over other apps**.
            3. Tap **Connect S Pen**. You should see a persistent **Running in background** notification.
            4. Tap **Allow background battery** (Samsung: Apps → AirPen Studio → Battery → Unrestricted).
            5. Hold the S Pen side button and **flick up** to scroll up, **flick down** to scroll down.
            6. Gestures tab: remap any flick if you want Home / notifications back.

            Existing installs keep custom mappings. If flick up was still Home, this update remaps it to scroll.
