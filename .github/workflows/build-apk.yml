name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Fetch S Pen SDK
        run: |
          mkdir -p app/libs
          curl -fsSL -o app/libs/spenremote-v1.0.1.jar https://raw.githubusercontent.com/jojczak/PenMouseS/main/libs/spenremote-v1.0.1.jar
          curl -fsSL -o app/libs/sdk-v1.0.0.jar https://raw.githubusercontent.com/jojczak/PenMouseS/main/libs/sdk-v1.0.0.jar

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AirPenStudio.apk
          ls -lh dist/AirPenStudio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AirPenStudio
          path: dist/AirPenStudio.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: AirPen Studio 1.2.0
          files: dist/AirPenStudio.apk
          fail_on_unmatched_files: true
          body: |
            **1.2.0 air-gesture accuracy** — same S Pen connection as 1.1.1, much tighter flicks.

            - One Euro IMU filter kills S Pen tremor without dulling flicks
            - Radial dead zone: diagonals no longer get dropped
            - Velocity-weighted heading uses the ballistic peak, not settle-in/out
            - Cardinal bias: an up-flick with a bit of wrist drift stays up
            - Check marks / zigzags are no longer stolen as diagonal flicks
            - More → settings: cardinal bias, motion smoothing, settle trim, heading offset, adaptive dead zone

            **Uninstall any older AirPen Studio first**, then install this APK.

            1. Download **AirPenStudio.apk** below and install it.
            2. Enable **Accessibility** and **Display over other apps**.
            3. Tap **Connect S Pen**.
            4. Hold the side button and flick. Up/down still scrolls one page.
            5. If flicks land on a diagonal, raise **Cardinal bias** in More → settings.
            6. If the pen jitters, raise **Motion smoothing**. If flicks feel sticky, lower it.

